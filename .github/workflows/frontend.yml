name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

# Runs queue instead of overlapping, so an older commit never overwrites a newer image tag in gitops.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --watch=false
      - run: npm run build

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cam-node-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  update-gitops:
    name: Update GitOps manifests
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ruanvasco-labs/gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops
          ref: main

      - name: Update image tag and push
        working-directory: ./gitops
        env:
          MANIFEST: apps/cam-node/frontend.yaml
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          if [ ! -f "$MANIFEST" ]; then
            echo "::notice::$MANIFEST not in gitops yet, nothing to update"
            exit 0
          fi
          sed -i "s|image: ghcr.io/.*/cam-node-frontend:.*|image: $IMAGE:$GITHUB_SHA|" "$MANIFEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git diff --cached --quiet && exit 0
          git commit -m "chore(cam-node-frontend): update image tag to $GITHUB_SHA"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

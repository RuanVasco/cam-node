name: API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/api.yml'

# Runs queue instead of overlapping, so an older commit never overwrites a newer image tag in gitops.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Testcontainers uses the runner's Docker for Postgres and MinIO.
      - name: Build and test
        working-directory: ./backend
        run: ./mvnw -B clean verify

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cam-node-api" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  update-gitops:
    name: Update GitOps manifests
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ruanvasco-labs/gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops
          ref: main

      - name: Update image tag and push
        working-directory: ./gitops
        env:
          MANIFEST: apps/cam-node/api.yaml
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          if [ ! -f "$MANIFEST" ]; then
            echo "::notice::$MANIFEST not in gitops yet, nothing to update"
            exit 0
          fi
          sed -i "s|image: ghcr.io/.*/cam-node-api:.*|image: $IMAGE:$GITHUB_SHA|" "$MANIFEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git diff --cached --quiet && exit 0
          git commit -m "chore(cam-node-api): update image tag to $GITHUB_SHA"
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep 5
          done

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: camnode
      POSTGRES_USER: camnode
      POSTGRES_PASSWORD: camnode
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camnode -d camnode"]
      interval: 5s
      retries: 10

  # MinIO no longer publishes images to Docker Hub or quay.io; the Bitnami legacy build is the closest
  # pullable release to the homelab one and creates the bucket from MINIO_DEFAULT_BUCKETS.
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: camnode
      MINIO_ROOT_PASSWORD: camnode-secret
      MINIO_DEFAULT_BUCKETS: cam-node-photos
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

volumes:
  db-data:
  minio-data:

<h2 mat-dialog-title>{{ messages.adminKey.title }}</h2>
<form (submit)="confirm($event)">
  <mat-dialog-content>
    @if (error) {
      <p class="error" role="alert">{{ error }}</p>
    }
    <mat-form-field>
      <mat-label>{{ messages.adminKey.label }}</mat-label>
      <input
        matInput
        type="password"
        autocomplete="current-password"
        [formField]="keyForm.key"
        cdkFocusInitial
      />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>{{ messages.adminKey.cancel }}</button>
    <button mat-flat-button type="submit" [disabled]="keyForm().invalid()">
      {{ messages.adminKey.confirm }}
    </button>
  </mat-dialog-actions>
</form>

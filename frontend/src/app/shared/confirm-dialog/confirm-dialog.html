<mat-dialog-content>
  <p>{{ data.question }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">{{ data.cancel }}</button>
  <button mat-flat-button type="button" [mat-dialog-close]="true">{{ data.confirm }}</button>
</mat-dialog-actions>

services:
  simulator:
    build:
      context: .
    environment:
      API_URL: ${API_URL:-http://host.docker.internal:8080}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-local-device-key}
      PHOTO_PATH: /photos/sample.jpg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./photos:/photos:ro
